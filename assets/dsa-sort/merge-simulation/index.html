<!doctype html><html lang="vi"><meta charset="utf-8"><title>Merge · Trộn hai đoạn</title><link rel="stylesheet" href="style.css?v=20261112-syntax"><body>
<header><button id="reset" aria-label="Về đầu">↺</button><button id="prev" aria-label="Bước trước">↑</button><button id="play">▶ Chạy mô phỏng</button><button id="next" aria-label="Bước tiếp theo">↓</button><label>Tốc độ <select id="speed"><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option><option value="3">3×</option></select></label><span id="count"></span><input id="timeline" type="range" min="0" value="0" aria-label="Bước mô phỏng"></header>
<main><section><div class="inputs"><label>Đoạn trái<input id="leftInput" value="2, 5, 8, 12"></label><label>Đoạn phải<input id="rightInput" value="1, 5, 7, 10"></label><button id="apply">Áp dụng</button></div><p id="error" role="alert"></p><h3>A · Hai đoạn đã được sắp xếp</h3><div id="arr" class="cells"></div><p class="legend"><span class="left">Đoạn trái</span><span class="right">Đoạn phải</span></p><h3>C · Kết quả trộn</h3><div id="out" class="cells"></div><div id="vars"></div><p id="message" aria-live="polite"></p></section><aside id="code" aria-label="Mã giả Merge"></aside></main>
<script src="steps.js?v=20261112-symbols"></script><script src="app.js?v=20261112-symbols"></script></body></html>
